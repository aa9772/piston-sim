[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piston-sim"
version = "0.1.0"
description = "Multi-piston simulator with Modbus TCP, Excel configuration and fault injection"
authors = [
  { name="Andrea" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pandas",
  "matplotlib",
  "openpyxl",
  "pyModbusTCP"
]
